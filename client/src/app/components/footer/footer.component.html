<footer>
  <div class="image-underlay image-cover-g">
    <img src="footer-bg.jpg" aria-hidden="true" />
  </div>
  <nav>
    @if (contactInfo(); as contact) {
    <ul>
      <li>
        <div class="icon-container"><icon-envelope /></div>
        <a [href]="createMailto(contact.email)">{{ contact.email }}</a>
      </li>
      <li>
        <div class="icon-container"><icon-location-pin /></div>
        <a [href]="createMapLink(contact.address)" target="_blank" rel="noopener noreferrer">{{ contact.address }}</a>
      </li>
      <li>
        <div class="icon-container"><icon-smartphone /></div>
        <a [href]="createPhoneLink(contact.phoneNumber)">{{ contact.phoneNumber }}</a>
      </li>
      <li>
        <div class="icon-container"><icon-brand-linkedin /></div>
        <a [href]="contact.linkedIn" target="_blank" rel="noopener noreferrer">Ardium</a>
      </li>
    </ul>
    } @else if (loading()) {
    <p i18n="@@common.loading">Loading...</p>
    } @else if (error()) {
    <p i18n="@@common.contact-unavailable">Contact information is currently unavailable.</p>
    }
  </nav>
</footer>
