<header [class.is-scrolled]="isScrolled()">
  <div class="content-width-g header-container">
    <a class="logo" routerLink="/" aria-label="Ardium - strona główna" i18n-aria-label="@@header.logoLabel">
      <img src="ardium_logo.png" alt="Ardium logo" />
    </a>
    <app-icon-button (click)="isOpen.set(!isOpen())">
      <app-hamburger-menu [open]="isOpen()" />
    </app-icon-button>
    <nav [class.open]="isOpen()">
      <ul>
        <li>
          <a routerLink="/" (click)="closeMenu()" i18n="@@header.home">Start</a>
        </li>
        <li>
          <a routerLink="/" fragment="services-section" (click)="closeMenu()" i18n="@@header.services">Usługi</a>
        </li>
        <li>
          <a routerLink="/" fragment="contact-section" (click)="closeMenu()" i18n="@@header.contact">Napisz do nas</a>
        </li>
        <li>
          <a routerLink="/faq" (click)="closeMenu()" i18n="@@header.faq">FAQ</a>
        </li>
        <li>
          <a routerLink="/about" (click)="closeMenu()" i18n="@@header.about">O nas</a>
        </li>
        <li class="blog-link">
          <a routerLink="/blog" (click)="closeMenu()" i18n="@@header.blog">Blog</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
