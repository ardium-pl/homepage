<section>
  <div class="content-width-g">
    <div class="heading-container-g center-g">
      <app-pre-heading>{{ content().companySection.preHeading }}</app-pre-heading>
      <h2>{{ content().companySection.title }}</h2>
    </div>

    <div class="qualities">
      @for (q of content().companySection.qualities; track q._key) {
        <div class="quality">
          <h3>{{ q.title }}</h3>
          <p>{{ q.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
