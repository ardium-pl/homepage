<section>
  <div class="content-width-g">
    @if (content(); as about) {
      <div class="left-right-container">
        <div>
          @if (about.title) {
            <div class="heading-container-g">
              <h3>{{ about.title }}</h3>
            </div>
          }
          @for (paragraph of about.paragraphs; track $index) {
            <p>{{ paragraph }}</p>
          }
        </div>
        <div class="with-img">
          @if (about.imageUrl) {
            <img [src]="about.imageUrl" class="llm-img" alt="About us" />
          }
        </div>
      </div>
    } @else if (loading()) {
      <p i18n="@@common.loading">Ładowanie...</p>
    } @else if (error()) {
      <p i18n="@@common.content-unavailable">Treść jest obecnie niedostępna.</p>
    }
  </div>
</section>
