<section class="privacy-hero">
  <div class="bg-pattern image-cover-g">
    <img src="pattern1.jpg" alt="" aria-hidden="true" />
  </div>
  <div class="hero-content content-width-g">
    <div class="heading-container">
      <div class="striped-decor" aria-hidden="true"></div>
      <app-pre-heading i18n="@@privacy.preheading">Informacje</app-pre-heading>
      <h1 i18n="@@privacy.title">Polityka prywatności</h1>
    </div>
    <p i18n="@@privacy.subtitle">Dowiedz się, w jaki sposób przetwarzamy i chronimy Twoje dane osobowe.</p>
  </div>
</section>

<section class="privacy-content">
  <article>
    @if (policy(); as content) {
      <p class="updated-at"><span i18n="@@privacy.updatedAt">Ostatnia aktualizacja:</span> {{ content.updatedAt }}</p>
      <app-portable-content [nodes]="content.content" />
    } @else if (loading()) {
      <p class="status" i18n="@@common.loading">Ładowanie...</p>
    } @else if (error()) {
      <p class="status" i18n="@@common.content-unavailable">Treść jest obecnie niedostępna.</p>
    }
  </article>
</section>
