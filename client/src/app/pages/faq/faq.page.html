@if (content(); as faq) {
  <app-page-hero
    [preheading]="faq.preHeading || 'FAQ'"
    [title]="faq.title || 'Najczęstsze pytania'"
    [description]="faq.subtitle || ''"
  />

  <section class="faq-section">
    @for (item of faq.list; track item.key) {
      <app-faq-item [question]="item.question">
        {{ item.answer }}
      </app-faq-item>
    }
  </section>
} @else if (loading()) {
  <p i18n="@@common.loading">Ładowanie...</p>
} @else if (error()) {
  <p i18n="@@common.content-unavailable">Treść jest obecnie niedostępna.</p>
}
