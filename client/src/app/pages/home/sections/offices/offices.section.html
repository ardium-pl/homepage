<section>
  <div class="content-width-g">
    <div class="heading-container-g">
      <h2 i18n="@@offices.title">Our office</h2>
      <p i18n="@@offices.subtitle">If you want to meet with us in person.</p>
    </div>
    <div class="offices-container">
      @if (contactInfo(); as contact) {
      <app-office-card
        [city]="city"
        [address]="contact.address"
        [email]="contact.email"
        [phone]="contact.phoneNumber"
      />
      } @else if (loading()) {
      <p i18n="@@common.loading">Loading...</p>
      } @else if (error()) {
      <p i18n="@@common.contact-unavailable">Contact information is currently unavailable.</p>
      }
    </div>
  </div>
</section>
