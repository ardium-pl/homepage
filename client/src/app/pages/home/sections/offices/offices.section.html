<section>
  <div class="content-width-g">
    <div class="heading-container-g">
      <h2 i18n="@@offices.title">Nasze biuro</h2>
      <p i18n="@@offices.subtitle">Jeśli chcesz spotkać się z nami osobiście.</p>
    </div>
    <div class="offices-container">
      @if (contactInfo(); as contact) {
      <app-office-card
        [city]="city"
        [address]="contact.address"
        [email]="contact.email"
        [phone]="contact.phoneNumber"
      />
      } @else if (loading()) {
      <p i18n="@@common.loading">Ładowanie...</p>
      } @else if (error()) {
      <p i18n="@@common.contact-unavailable">Dane kontaktowe są obecnie niedostępne.</p>
      }
    </div>
  </div>
</section>
