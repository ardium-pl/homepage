server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sanity Studio is a single-page app; unknown paths must fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
