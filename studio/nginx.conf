server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sanity Studio is a single-page app; unknown paths must fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types doesn't map .mjs, so it falls back to
    # application/octet-stream and browsers refuse to load it as a JS module.
    # Scoping the override to this location (instead of a server-level `types`
    # block) avoids replacing the inherited map for every other extension.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
